name: Build Android app (Play Store)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      host:
        description: "Website address the app opens (no https://)"
        default: "freshfold-api-production-8165.up.railway.app"
      version_code:
        description: "Version number. Must be higher than the last upload to Google Play"
        default: "1"
      version_name:
        description: "Version name shown to users"
        default: "1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (already on the runner; accept licences and add Android 36)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || { echo "::error::sdkmanager failed"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key (created once, then reused for every update)
        env:
          REAL_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$REAL_PASSWORD" ]; then
            KS=android/upload-keystore.p12
            PW="$REAL_PASSWORD"
            echo "BUILD_KIND=play" >> "$GITHUB_ENV"
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -storetype PKCS12 -keystore "$KS" \
                -alias freshfolds -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$PW" -keypass "$PW" \
                -dname "CN=Fresh Folds, O=Fresh Folds, L=Delhi, C=IN"
              echo "NEW_KEYSTORE=1" >> "$GITHUB_ENV"
            fi
          else
            # No password secret yet: make a throw-away key so the build can still be tested.
            # This build is NOT for Google Play.
            KS=android/test-only.p12
            PW="test-only-key"
            echo "BUILD_KIND=test" >> "$GITHUB_ENV"
            keytool -genkeypair -storetype PKCS12 -keystore "$KS" \
              -alias freshfolds -keyalg RSA -keysize 2048 -validity 1000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Fresh Folds Test"
          fi
          echo "KS_PATH=$GITHUB_WORKSPACE/$KS" >> "$GITHUB_ENV"
          echo "::add-mask::$PW"
          echo "FF_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Point the app at the website address
        run: sed -i "s/FF_HOST/${{ inputs.host || 'freshfold-api-production-8165.up.railway.app' }}/g" android/app/src/main/res/values/strings.xml

      - name: Build
        run: |
          gradle -p android bundleRelease assembleRelease --console=plain \
            -PffKeystore="$KS_PATH" \
            -PffVersionCode=${{ inputs.version_code || '1' }} -PffVersionName="${{ inputs.version_name || '1.0' }}" > build.log 2>&1 || {
            echo "::error::Build failed: $(grep -E 'error|Error|FAILED|What went wrong|Could not|not found' -A2 build.log | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Show the signing fingerprint
        run: |
          FP=$(keytool -list -v -keystore "$KS_PATH" -storepass "$FF_KEYSTORE_PASSWORD" -alias freshfolds | grep "SHA256:" | sed 's/.*SHA256: //')
          echo "### Upload key SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo "$FP" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the signing key to the repository (first time only)
        if: env.NEW_KEYSTORE == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add android/upload-keystore.p12
          git commit -m "Add Play Store upload key (password protected)"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: fresh-folds-${{ env.BUILD_KIND }}-build
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk

      - name: Publish a download link for the APK
        if: env.BUILD_KIND == 'play'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Fresh-Folds.apk
          gh release create "build-${{ github.run_number }}" Fresh-Folds.apk \
            --title "Fresh Folds app (build ${{ github.run_number }})" \
            --notes "Install file for Android. Download Fresh-Folds.apk and open it." --latest
